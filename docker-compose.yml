x-broker-properties: &broker-common-configs
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "DOCKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-controller:9095"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
  KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: |
    org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="admin" \
    password="admin-secret" \
    user_admin="admin-secret";
  KAFKA_LISTENER_NAME_DOCKER_SASL_ENABLED_MECHANISMS: PLAIN
  # The two service accounts below back the website-analytics application instances.
  # Conduktor creates ACLs for these principals; declaring them here makes them real
  # SASL users so you can actually produce and consume as the application.
  KAFKA_LISTENER_NAME_DOCKER_PLAIN_SASL_JAAS_CONFIG:
    org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="admin" \
    password="admin-secret" \
    user_admin="admin-secret" \
    user_sa-website-analytics-dev="dev-secret" \
    user_sa-website-analytics-prod="prod-secret";
  KAFKA_SASL_JAAS_CONFIG:
    org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="admin" \
    password="admin-secret";
  KAFKA_SUPER_USERS: "User:admin"

services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_PASSWORD: pwd

  conduktor-console:
    image: conduktor/conduktor-console:1.47.1
    hostname: console
    container_name: console
    ports:
      - 8080:8080
    volumes:
      - ./console-config.yaml:/opt/conduktor/console-config.yaml
    environment:
      CDK_IN_CONF_FILE: /opt/conduktor/console-config.yaml
      # Self-service is a licensed feature. Without a license Console runs on the Free
      # plan and every Self-service API call returns 403.
      CDK_LICENSE: ${CDK_LICENSE:-}
      CDK_MONITORING_CORTEX-URL: http://conduktor-monitoring:9009/
      CDK_MONITORING_ALERT-MANAGER-URL: http://conduktor-monitoring:9010/
      CDK_MONITORING_CALLBACK-URL: http://console:8080/monitoring/api/
      CDK_MONITORING_NOTIFICATIONS-CALLBACK-URL: http://localhost:8080
    healthcheck:
      test: curl --fail --silent http://localhost:8080/api/health/live --output /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_started

  conduktor-monitoring:
    hostname: conduktor-monitoring
    image: conduktor/conduktor-console-cortex:1.19.0
    environment:
      CDK_CONSOLE-URL: "http://console:8080"

  kafka-controller:
    image: apache/kafka:4.0.0
    hostname: kafka-controller
    container_name: kafka-controller
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: "CONTROLLER://kafka-controller:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SASL_PLAINTEXT,DOCKER:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret";
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-controller:9095
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SUPER_USERS: "User:admin"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      test: nc -zv kafka-controller 9095 || exit 1
      interval: 2s
      retries: 25

  kafka-1:
    image: apache/kafka:4.0.0
    hostname: kafka-1
    container_name: kafka-1
    environment:
      <<: *broker-common-configs
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "DOCKER://kafka-1:9092"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER://kafka-1:9092"
    healthcheck:
      test: nc -zv kafka-1 9092 || exit 1
      interval: 5s
      retries: 25
    depends_on:
      kafka-controller:
        condition: service_healthy

  kafka-2:
    image: apache/kafka:4.0.0
    hostname: kafka-2
    container_name: kafka-2
    environment:
      <<: *broker-common-configs
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "DOCKER://kafka-2:9092"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER://kafka-2:9092"
    healthcheck:
      test: nc -zv kafka-2 9092 || exit 1
      interval: 5s
      retries: 25
    depends_on:
      kafka-controller:
        condition: service_healthy

  kafka-3:
    image: apache/kafka:4.0.0
    hostname: kafka-3
    container_name: kafka-3
    environment:
      <<: *broker-common-configs
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "DOCKER://kafka-3:9092"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER://kafka-3:9092"
    healthcheck:
      test: nc -zv kafka-3 9092 || exit 1
      interval: 5s
      retries: 25
    depends_on:
      kafka-controller:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    container_name: schema-registry
    ports:
      - 8081:8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "SASL_PLAINTEXT://kafka-1:9092,SASL_PLAINTEXT://kafka-2:9092,SASL_PLAINTEXT://kafka-3:9092"
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    healthcheck:
      test: curl --fail --silent http://localhost:8081/subjects --output /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  conduktor-gateway:
    image: conduktor/conduktor-gateway:3.18.0
    hostname: conduktor-gateway
    container_name: conduktor-gateway
    ports:
      - 8888:8888
      - 9092-9095:19092-19095
    environment:
      GATEWAY_LICENSE_KEY: ${CDK_LICENSE:-}
      GATEWAY_MIN_BROKERID: 1
      GATEWAY_SECURITY_MODE: KAFKA_MANAGED
      GATEWAY_FEATURE_FLAGS_INTERNAL_LOAD_BALANCING: "false"

      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";

      # Docker listener - for services inside the Docker network
      GATEWAY_LISTENER_DOCKER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      GATEWAY_LISTENER_DOCKER_ROUTING: port
      GATEWAY_LISTENER_DOCKER_PORTS: 9092-9095
      GATEWAY_LISTENER_DOCKER_ADVERTISED_HOST: conduktor-gateway

      # Laptop listener - for access from outside the Docker network (localhost)
      GATEWAY_LISTENER_LAPTOP_SECURITY_PROTOCOL: SASL_PLAINTEXT
      GATEWAY_LISTENER_LAPTOP_ROUTING: port
      GATEWAY_LISTENER_LAPTOP_PORTS: 9092-9095:19092-19095
      GATEWAY_LISTENER_LAPTOP_ADVERTISED_HOST: localhost
    healthcheck:
      test: curl --fail --silent http://localhost:8888/health/ready --output /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  conduktor-ctl:
    image: conduktor/conduktor-ctl:v0.9.2
    container_name: conduktor-ctl
    entrypoint: sleep infinity # keep the container up so you can exec into it
    volumes:
      - ./:/self-service
    working_dir: /self-service
    environment:
      # Only the Console URL lives here. Credentials and tokens are passed per
      # command with `docker compose exec -e`, so nothing sensitive is baked into
      # this file and CDK_USER never coexists with CDK_API_KEY — the CLI rejects
      # that combination outright when CDK_AUTH_MODE is `external`.
      CDK_BASE_URL: "http://console:8080"
    depends_on:
      conduktor-console:
        condition: service_healthy
